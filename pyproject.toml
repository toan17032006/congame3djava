[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "samurai-web"
version = "1.0.0"
description = "Samurai 3D Action RPG - FastAPI backend + Three.js client"
requires-python = ">=3.10"

[project.scripts]
samurai = "server.cli:main"

[tool.setuptools]
packages = ["server"]
